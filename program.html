<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
    <h1>SKSBV DALIL UNIT MEELAD 2026</h1>
    <p>Program Management</p>
</header>

<div class="login-box">

    <h2>Add Program</h2>

    <input type="text" id="programName" placeholder="Program Name">

    <br><br>

    <button id="saveProgram">Save Program</button>

    <input type="hidden" id="edited">

<button id="cancelBtn" style="display:none;">
    Cancel
</button>

    <hr>

    <input
    type="text"
    id="searchProgram"
    placeholder="🔍 Search Program"
>

<br><br>

<h3>Program List</h3>

<table border="1" width="100%">
    <thead>
        <tr>
            <th>Program Name</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="programList"></tbody>
</table>

</div>

<script type="module" src="program.js"></script>

</body>

</html>
