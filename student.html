<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="student.css">
</head>

<body>

<a href="index.html" class="back-btn">← Home</a>

<div class="page-header">
    <h1>👨‍🎓 Students</h1>
    <p>SKSBV DALIL UNIT – Meelad 2026</p>
</div>

<div class="card">

    <input
        type="text"
        id="name"
        placeholder="Student Name"
    >

    <input
        type="text"
        id="father"
        placeholder="Father Name"
    >

    <select id="category">
        <option>Kidees</option>
        <option>Sub Junior</option>
        <option>Junior</option>
        <option>Senior</option>
        <option>Super Senior</option>
    </select>

    <input type="hidden" id="editedStudent">

<button id="cancelBtn" style="display:none;">
    Cancel
</button>

    <button id="saveBtn">
        Save Student
    </button>

</div>

<br>

<input
    type="text"
    id="search"
    placeholder="🔍 Search Student"
>

<br><br>

<table>

<thead>

<tr>

<th>Name</th>
<th>Father</th>
<th>Category</th>
<th>Action</th>

</tr>

</thead>

<tbody id="studentList">

</tbody>

</table>

<script type="module" src="student.js"></script>

</body>
</html>
